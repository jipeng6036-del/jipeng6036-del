<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Jasper — Small fixes. Better agents.</title>
  <desc id="desc">A pale blue and lavender banner with a branching contribution path merging into one.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef7ff"/><stop offset=".55" stop-color="#f1eeff"/><stop offset="1" stop-color="#fff0f5"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#497fce"/><stop offset=".55" stop-color="#8266cf"/><stop offset="1" stop-color="#d88baa"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8d83ae" opacity=".14"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect x="700" width="500" height="340" fill="url(#dots)"/>
  <circle cx="1100" cy="25" r="150" fill="#fff" opacity=".35"/>
  <circle cx="1180" cy="345" r="205" fill="#edddfa" opacity=".3"/>
  <g font-family="Segoe UI,Arial,sans-serif">
