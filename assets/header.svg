    <text x="50" y="143" font-size="64" font-weight="700" letter-spacing="-2.5" fill="#282b46">Small fixes.</text>
    <text x="50" y="216" font-size="64" font-weight="700" letter-spacing="-2.5" fill="url(#ink)">Better agents.</text>
    <text x="54" y="282" font-size="17" fill="#64677e">AI AGENTS <tspan fill="#b5a6cf"> / </tspan> RAG <tspan fill="#b5a6cf"> / </tspan> LLM WORKFLOWS</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M790 103 H870 C930 103 900 170 963 170 H1110" stroke="#b69bdd"/>
    <path d="M767 237 H857 C922 237 904 170 963 170" stroke="#d5a2bd"/>
    <path d="M739 170 H1110" stroke="#8aaee1"/>
  </g>
  <g fill="#faf8ff" stroke-width="3">
    <circle cx="790" cy="103" r="11" stroke="#b69bdd"/>
    <circle cx="767" cy="237" r="11" stroke="#d5a2bd"/>
    <circle cx="739" cy="170" r="11" stroke="#8aaee1"/>
    <circle cx="969" cy="170" r="23" stroke="#9079c7"/>
    <circle cx="1110" cy="170" r="11" stroke="#8aaee1"/>
  </g>
  <path d="m959 170 7 7 13-15" fill="none" stroke="#9079c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="924" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3" fill="#817591">MERGED</text>
